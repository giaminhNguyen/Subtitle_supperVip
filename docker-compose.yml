services:
  api:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file: .env
    volumes:
      - ./data:/app/data
    ports: ["8000:8000"]
  worker:
    build: ./backend
    command: sh -c "alembic upgrade head && python -m app.worker"
    env_file: .env
    volumes:
      - ./data:/app/data
  web:
    build: ./frontend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
    ports: ["5173:5173"]
    depends_on: [api]
