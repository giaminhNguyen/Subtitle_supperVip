services:
  api:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file: .env
    volumes:
      - ./data:/app/data
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
  worker:
    build: ./backend
    command: python -m app.worker
    env_file: .env
    volumes:
      - ./data:/app/data
    # The API container applies migrations; the worker waits for it so both never migrate the shared SQLite file at once.
    depends_on:
      api:
        condition: service_healthy
  web:
    build: ./frontend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
    ports: ["5173:5173"]
    depends_on: [api]
